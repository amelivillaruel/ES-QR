<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Convertidor </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    
</head>
<body class="bg-body-tertiary d-flex flex-column min-vh-100" style="font-family: 'Inter', system-ui, -apple-system, sans-serif;">

    <header class="container py-3" style="max-width: 640px;">
        <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-info bg-gradient text-white rounded-3 d-inline-flex align-items-center justify-content-center shadow-sm" style="width: 42px; height: 42px;">
                    <i class="bi bi-qr-code fs-5"></i>
                </div>
                <div>
                    <div class="fw-bold lh-sm">Convertidor QR </div>
                    <div class="text-body-secondary small">Conversor de enlaces a QR</div>
                </div>
            </div>

            <button id="themeToggle" class="btn btn-outline-secondary rounded-3 border-secondary-subtle bg-body shadow-sm" type="button" aria-label="Cambiar tema claro u oscuro" title="Cambiar tema">
                <i id="themeIcon" class="bi bi-moon-stars-fill"></i>
            </button>
        </div>
    </header>

    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-3">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6" style="max-width: 480px;">
                <div class="card border-secondary-subtle shadow rounded-4 p-3 p-sm-4">
                    <div class="card-body d-flex flex-column gap-4 p-2">
                        
                        <div class="text-center">
                            <h1 class="h4 fw-bold mb-2">Convierte tu enlace en QR</h1>
                            <p class="text-body-secondary small mb-0">
                                Escribe o pega cualquier dirección web para obtener tu código QR al instante.
                            </p>
                        </div>

                        <div>
                            <label for="urlInput" class="form-label small fw-semibold text-body-secondary mb-2">
                                Enlace o URL
                            </label>
                            <div class="input-group input-group-lg shadow-sm rounded-3">
                                <span class="input-group-text bg-body border-secondary-subtle text-body-secondary">
                                    <i class="bi bi-link-45deg"></i>
                                </span>
                                <input
                                    type="url"
                                    id="urlInput"
                                    class="form-control bg-body border-secondary-subtle fs-6"
                                    placeholder="https://ejemplo.com"
                                    autocomplete="off"
                                    spellcheck="false"
                                    autofocus
                                >
                                <button
                                    type="button"
                                    id="clearBtn"
                                    class="btn btn-outline-warning border-secondary-subtle d-none"
                                    aria-label="Limpiar enlace"
                                    title="Limpiar texto"
                                >
                                    <i class="bi bi-x-lg"></i>
                                </button>
                            </div>
                        </div>

                        <div id="qrStage" class="bg-body-tertiary border border-2 border-secondary-subtle rounded-4 p-4 d-flex flex-column align-items-center justify-content-center text-center" style="min-height: 290px; border-style: dashed !important;">
                            
                            <div id="emptyState" class="d-flex flex-column align-items-center gap-2 py-2" style="max-width: 260px;">
                                <div class="bg-body border border-secondary-subtle rounded-4 shadow-sm d-inline-flex align-items-center justify-content-center text-primary mb-2" style="width: 68px; height: 68px;">
                                    <i class="bi bi-qr-code-scan fs-2"></i>
                                </div>
                                <div class="fw-semibold">Esperando tu enlace</div>
                                <p class="text-body-secondary small mb-0">
                                    Pega un enlace arriba y generaremos automáticamente un código QR listo para usar.
                                </p>
                            </div>

                            <div id="qrOutput" class="d-none flex-column align-items-center gap-3 w-100">
                                <div class="bg-white p-3 rounded-4 shadow-sm border d-inline-flex align-items-center justify-content-center">
                                    <canvas id="qrCanvas" width="512" height="512" class="rounded-2 img-fluid" style="width: 210px; height: 210px;"></canvas>
                                </div>
                                <div class="d-flex align-items-center justify-content-center gap-2 mw-100">
                                    <span class="badge rounded-pill text-bg-secondary fw-medium"></span>
                                    <strong><span id="qrPreviewUrl" class="text-body-secondary small text-truncate" style="max-width: 210px;"></span></strong>
                                </div>
                            </div>

                        </div>

                        <div id="actionsRow" class="row g-2 d-none">
                            <div class="col-12 col-sm-6">
                                <button type="button" id="downloadBtn" class="btn btn-primary w-100 py-2 fw-semibold rounded-3 d-inline-flex align-items-center justify-content-center gap-2 shadow-sm">
                                    <i id="downloadIcon" class="bi bi-download"></i>
                                    <span id="downloadLabel">Descargar QR</span>
                                </button>
                            </div>
                            <div class="col-12 col-sm-6">
                                <button type="button" id="copyBtn" class="btn btn-outline-secondary w-100 py-2 fw-semibold rounded-3 d-inline-flex align-items-center justify-content-center gap-2">
                                    <i id="copyIcon" class="bi bi-clipboard"></i>
                                    <span id="copyLabel">Copiar QR</span>
                                </button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </main>
    <p class="text-center">Desarrollado por: Romel<strong> </strong> </p>

    <footer class="container text-center py-3 text-body-secondary small">
       
    </footer>

    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3">
        <div id="liveToast" class="toast align-items-center text-bg-dark border-0 rounded-pill px-2 shadow" role="status" aria-live="polite" aria-atomic="true">
            <div class="d-flex align-items-center">
                <div class="toast-body d-flex align-items-center gap-2 py-2">
                    <i id="toastIcon" class="bi bi-check-circle-fill text-success"></i>
                    <span id="toastMessage">Listo</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
